services:
  # Web サーバー (Nginx)
  web:
    image: nginx:alpine
    container_name: laravel-web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-network

  # PHP アプリケーション (Laravel 13)
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: laravel-app
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel-network
  queue-worker:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: laravel-queue-worker
    # 起動コマンドで直接 queue:work を実行させる
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-jobs=1000 --max-time=3600
    restart: unless-stopped # プロセスやコンテナが落ちたらDockerが自動再起動してくれる
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel-network
  # データベース (MySQL)
  db:
    image: mysql:8.0
    container_name: laravel-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  db-data:
